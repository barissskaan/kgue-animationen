<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KGÜ 5 · Aufgabe 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Gleicher Stil wie Aufgabe 1 und der Scheduling-Film: bewusst nur hell (Beamer).
   Links: drei Prozess-Karten, die Prioritäts-Linie und die Zeitscheiben. Rechts: Tabelle 1 vom Blatt.
   Regel: erst Text, Animation erst nach Klick. Keine Emoji. */
:root {
  color-scheme: light;
  --bg: #ffffff; --fg: #16181d; --muted: #5d6370; --line: #c9ced8; --soft: #f1f2f5;
  --warn: #c2410c; --hl: #fff1a8; --ptr: #ffd400; --cand: #2f5fb8;
  --pA: #2f5fb8; --pB: #c2410c; --pC: #4d7c0f;
  --lA: #cfdcf5; --lB: #f7d5c2; --lC: #d5e6bd;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 18px; line-height: 1.4; }
.wrap { max-width: 1500px; margin: 0 auto; padding: 10px 16px 10px; }
.top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; height: 24px;
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.top .act { color: var(--fg); }
button { font: inherit; font-size: 16px; cursor: pointer; border-radius: 8px; border: 1.5px solid var(--fg); background: var(--bg); color: var(--fg); padding: 6px 14px; font-weight: 600; }
button:disabled { opacity: 0.35; cursor: default; }
button:focus-visible { outline: 3px solid var(--cand); outline-offset: 2px; }

.stagebox { position: relative; margin-top: 4px; }
.stage { position: absolute; left: 0; top: 0; width: 1000px; height: 380px; transform-origin: 0 0; }
.stage.noanim, .stage.noanim * { transition: none !important; }
.lab { position: absolute; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; white-space: nowrap; }
.grp { transition: opacity 0.5s; }
.grp.off { opacity: 0; pointer-events: none; }

/* Karten */
.card { position: absolute; top: 10px; width: 180px; height: 110px; border: 2px solid var(--fg); border-radius: 12px; background: #fff; padding: 6px 9px; transition: box-shadow 0.35s, background 0.35s; }
.card.win { box-shadow: 0 0 0 5px var(--ptr); }
.card.ran { background: #fff8e0; }
.card .hd { display: flex; align-items: center; gap: 8px; height: 30px; font-size: 14.5px; }
.card .hd i { flex: none; width: 28px; height: 28px; border-radius: 7px; color: #fff; font-style: normal; font-weight: 600; font-size: 17px; line-height: 28px; text-align: center; }
.card .hd b { font-family: var(--font-mono); font-size: 18px; }
.card .bd { position: absolute; right: 8px; top: -10px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; background: var(--ptr); border: 1.5px solid var(--fg); border-radius: 999px; padding: 0 7px; line-height: 17px; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
.card.win .bd, .card.ran .bd { opacity: 1; }
.card .rw { display: flex; align-items: baseline; gap: 6px; height: 34px; line-height: 34px; border-top: 1px solid var(--line); transition: opacity 0.4s; }
.card .rw span { font-size: 13px; color: var(--muted); font-weight: 600; width: 58px; }
.card .rw b { font-family: var(--font-mono); font-size: 23px; width: 34px; text-align: right; transition: color 0.3s, opacity 0.3s; }
.card .rw em { font-family: var(--font-mono); font-style: normal; font-size: 12.5px; color: var(--fg); white-space: nowrap; background: var(--hl); border-radius: 4px; padding: 0 4px; line-height: 20px; transition: opacity 0.3s; }
.card .rw em:empty { opacity: 0; }
.card .rw.stale b { opacity: 0.28; }
.card.norows .rw { opacity: 0; }
.card .rw b.pop { animation: pop 0.5s; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); color: var(--warn); } 100% { transform: scale(1); } }

/* Schritte */
#steps { position: absolute; left: 10px; top: 128px; width: 560px; display: flex; gap: 7px; }
#steps span { font-size: 12.5px; font-weight: 600; white-space: nowrap; border: 1.5px solid var(--line); border-radius: 999px; padding: 1px 9px 1px 3px; color: var(--muted); transition: background 0.3s, color 0.3s, border-color 0.3s; }
#steps span i { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--line); color: #fff; font-style: normal; font-size: 11.5px; line-height: 18px; text-align: center; margin-right: 5px; transition: background 0.3s; }
#steps span.on { background: var(--hl); color: var(--fg); border-color: var(--fg); }
#steps span.on i { background: var(--fg); }
#steps code { font-family: var(--font-mono); font-size: 12px; }

/* Prioritäts-Linie */
.trk { position: absolute; left: 44px; width: 512px; height: 2px; background: var(--line); }
.bas { position: absolute; width: 3px; height: 24px; background: var(--fg); border-radius: 2px; }
.bar { position: absolute; height: 10px; border-radius: 0 5px 5px 0; transition: width 0.9s cubic-bezier(0.5, 0, 0.2, 1); }
.tok { position: absolute; width: 28px; height: 24px; border-radius: 7px; color: #fff; font-weight: 600; font-size: 15px; line-height: 24px; text-align: center; z-index: 3;
  transition: left 0.9s cubic-bezier(0.5, 0, 0.2, 1), box-shadow 0.3s; box-shadow: 0 2px 5px rgba(20, 25, 40, 0.3); }
.tok.win { box-shadow: 0 0 0 4px var(--ptr), 0 2px 5px rgba(20, 25, 40, 0.3); }
.tick { position: absolute; top: 258px; width: 30px; margin-left: -15px; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tick::before { content: ""; position: absolute; left: 14px; top: -5px; width: 2px; height: 5px; background: var(--muted); }
#axis { position: absolute; left: 44px; top: 256px; width: 512px; height: 2px; background: var(--muted); }

/* Zeitscheiben */
.sn { position: absolute; top: 304px; width: 40px; text-align: center; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); font-weight: 600; }
.sc { position: absolute; top: 322px; width: 40px; height: 32px; border: 1px solid var(--line); background: #fff; color: #fff; font-weight: 600; font-size: 17px; line-height: 30px; text-align: center; overflow: hidden; }
.sc i { position: absolute; inset: 0; font-style: normal; opacity: 0; transform: scale(0.4); transition: opacity 0.35s, transform 0.35s; }
.sc.on i { opacity: 1; transform: none; }
.sc.ghost i { opacity: 0.55; transform: none; }
.gb { position: absolute; top: 357px; height: 9px; border: 3px solid var(--fg); border-top: 0; border-radius: 0 0 7px 7px; opacity: 0; transition: opacity 0.4s; }
.gb.on { opacity: 1; }

/* Anteile */
#share { position: absolute; left: 10px; top: 6px; width: 560px; height: 112px; background: #fff; border: 2px solid var(--fg); border-radius: 12px; padding: 8px 12px; z-index: 6; transition: opacity 0.5s; }
#share.off { opacity: 0; pointer-events: none; }
#share div { display: flex; align-items: center; gap: 10px; height: 31px; font-size: 16px; }
#share i { width: 26px; height: 26px; border-radius: 6px; color: #fff; font-style: normal; font-weight: 600; text-align: center; line-height: 26px; }
#share u { display: block; height: 20px; width: 0; border-radius: 4px; transition: width 1s cubic-bezier(0.5, 0, 0.2, 1); text-decoration: none; }
#share:not(.off) u { width: var(--w); }

/* Tabelle 1 */
#tbl { position: absolute; left: 590px; top: 4px; width: 400px; }
.th, .tr { display: flex; }
.th > div { font-size: 12px; font-weight: 600; text-align: center; text-transform: uppercase; letter-spacing: 0.03em; }
.th.b > div { font-size: 10.5px; letter-spacing: 0; }
.th.a > div { height: 21px; line-height: 21px; color: #fff; }
.th.b > div { height: 18px; line-height: 18px; color: var(--muted); background: var(--soft); }
.tr { height: 25px; border-bottom: 1px solid var(--line); transition: background 0.4s; }
.tr > div { line-height: 24px; text-align: center; font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
.tr > div > span { display: inline-block; opacity: 0; transition: opacity 0.4s; border-radius: 5px; padding: 0 5px; line-height: 20px; }
.tr > div.on > span { opacity: 1; }
.tr > div.min > span { background: var(--ptr); box-shadow: 0 0 0 1.5px var(--fg); }
.tr .zs { color: var(--muted); }
.tr .zs span { opacity: 1; }
.tr .pk span { color: #fff; width: 24px; padding: 0; }
.tr.cur { background: #f6f7fa; box-shadow: inset 4px 0 0 var(--fg); }
.tr.same { background: var(--hl); }
.w1 { width: 34px; } .w2 { width: 48px; } .w3 { width: 53px; } .w6 { width: 106px; }
.sepl { border-left: 2px solid var(--fg); }

/* Text und Bedienung */
.cap { margin-top: 8px; min-height: 118px; }
.cap h1 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; font-weight: 600; }
.cap p { margin: 0; font-size: 21px; line-height: 1.35; max-width: 84ch; }
.ctl { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.dot { width: 30px; height: 30px; padding: 0; border-radius: 50%; border-color: var(--line); font-family: var(--font-mono); font-size: 14px; }
.dot[aria-current="step"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
#next { min-width: 170px; background: var(--fg); color: var(--bg); margin-left: auto; }
#next.play { background: var(--ptr); color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="act" id="act"></span><span id="cnt"></span></div>
  <div class="stagebox" id="box">
    <div class="stage" id="stage">
      <div class="grp" id="g-cards"></div>
      <div id="share" class="off"></div>
      <div class="grp" id="g-steps">
        <div id="steps">
          <span><i>1</i>Strafe + 42</span>
          <span><i>2</i><code>penalty / 2</code></span>
          <span><i>3</i><code>prio = penalty + base</code></span>
          <span><i>4</i>kleinste gewinnt</span>
        </div>
      </div>
      <div class="grp" id="g-line">
        <div class="lab" style="left:44px;top:156px">Priorität · weiter links = früher dran</div>
        <div id="axis"></div>
      </div>
      <div class="grp" id="g-strip">
        <div class="lab" style="left:44px;top:284px">Wer bekommt welche Zeitscheibe?</div>
      </div>
      <div class="grp" id="g-tbl"><div id="tbl"></div></div>
    </div>
  </div>
  <div class="cap"><h1 id="ttl"></h1><p id="say"></p></div>
  <div class="ctl">
    <button id="prev" aria-label="Zurück">←</button>
    <span id="dots" style="display:flex;gap:6px"></span>
    <button id="replay" aria-label="Teil neu starten" title="Teil neu starten (R)">↺</button>
    <button id="next">Weiter →</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), box = $('box');
  const N = ['A', 'B', 'C'], BASE = { A: 18, B: 33, C: 27 }, PEN = 42, ROWS = 13;
  const X = p => 44 + (p - 15) * 8.2, TY = { A: 176, B: 204, C: 232 };

  /* ---------- Simulation: jede Zeile in vier Bildern (Strafe, Halbieren, Priorität, Auswahl) ---------- */
  const F = [], rows = [];
  (() => {
    const pen = { A: 0, B: 0, C: 0 }, prio = { ...BASE };
    let vals = 1, picks = 0, win = null, cp = {}, cr = {};
    const fr = (n, ph) => F.push({ n, ph, pen: { ...pen }, prio: { ...prio }, vals, picks, win, cp: { ...cp }, cr: { ...cr } });
    const best = () => N.reduce((a, b) => prio[b] < prio[a] ? b : a);
    rows[0] = { pen: { ...pen }, prio: { ...prio } };
    fr(0, 'prio');
    win = best(); rows[0].pick = win; picks = 1; fr(0, 'pick');
    for (let n = 1; n < ROWS; n++) {
      const r = win; cp = { [r]: '= ' + pen[r] + ' + ' + PEN }; cr = {}; pen[r] += PEN; fr(n, 'pen');
      cp = {}; N.forEach(x => { cp[x] = '= ' + pen[x] + ' / 2'; pen[x] = Math.floor(pen[x] / 2); }); fr(n, 'half');
      N.forEach(x => { prio[x] = pen[x] + BASE[x]; cr[x] = '= ' + pen[x] + ' + ' + BASE[x]; });
      rows[n] = { pen: { ...pen }, prio: { ...prio } }; vals = n + 1; win = null; fr(n, 'prio');
      cp = {}; cr = {}; win = best(); rows[n].pick = win; picks = n + 1; fr(n, 'pick');
    }
  })();
  const fi = (n, ph) => F.findIndex(f => f.n === n && f.ph === ph);
  const LAST = F.length - 1;

  /* ---------- Bühne aufbauen ---------- */
  const card = {}, tok = {}, bar = {}, sc = [], tr = [], gb = [];
  N.forEach((n, i) => {
    const c = document.createElement('div'); c.className = 'card'; c.style.left = 10 + i * 190 + 'px';
    c.innerHTML = '<div class="hd"><i style="background:var(--p' + n + ')">' + n + '</i>Basis <b>' + BASE[n] + '</b><span class="bd"></span></div>' +
      '<div class="rw"><span>Penalty</span><b></b><em></em></div><div class="rw"><span>Priorität</span><b></b><em></em></div>';
    $('g-cards').appendChild(c); card[n] = c;
    const L = $('g-line');
    const t = document.createElement('div'); t.className = 'trk'; t.style.top = TY[n] + 11 + 'px'; L.appendChild(t);
    const b = document.createElement('div'); b.className = 'bar'; b.style.left = X(BASE[n]) + 'px'; b.style.top = TY[n] + 7 + 'px'; b.style.background = 'var(--l' + n + ')'; L.appendChild(b); bar[n] = b;
    const s = document.createElement('div'); s.className = 'bas'; s.style.left = X(BASE[n]) - 1.5 + 'px'; s.style.top = TY[n] + 'px'; L.appendChild(s);
    const k = document.createElement('div'); k.className = 'tok'; k.style.top = TY[n] + 'px'; k.style.background = 'var(--p' + n + ')'; k.textContent = n; L.appendChild(k); tok[n] = k;
  });
  for (let p = 20; p <= 70; p += 10) { const t = document.createElement('div'); t.className = 'tick'; t.style.left = X(p) + 'px'; t.textContent = p; $('g-line').appendChild(t); }
  for (let n = 0; n < ROWS; n++) {
    const a = document.createElement('div'); a.className = 'sn'; a.style.left = 44 + n * 40 + 'px'; a.textContent = n; $('g-strip').appendChild(a);
    const c = document.createElement('div'); c.className = 'sc'; c.style.left = 44 + n * 40 + 'px'; c.innerHTML = '<i></i>'; $('g-strip').appendChild(c); sc[n] = c;
  }
  for (let g = 0; g < 3; g++) { const b = document.createElement('div'); b.className = 'gb'; b.style.left = 46 + g * 160 + 'px'; b.style.width = '156px'; $('g-strip').appendChild(b); gb.push(b); }
  (() => {
    let h = '<div class="th a"><div class="w1" style="background:var(--muted)">ZS</div><div class="w2" style="background:var(--muted)">dran</div>';
    N.forEach(n => { h += '<div class="w6" style="background:var(--p' + n + ')">Prozess ' + n + '</div>'; });
    h += '</div><div class="th b"><div class="w1"></div><div class="w2"></div>';
    N.forEach(() => { h += '<div class="w3 sepl">Penalty</div><div class="w3">Prio</div>'; });
    h += '</div>';
    for (let n = 0; n < ROWS; n++) {
      h += '<div class="tr"><div class="w1 zs"><span>' + n + '</span></div><div class="w2 pk"><span style="background:var(--p' + rows[n].pick + ')">' + rows[n].pick + '</span></div>';
      N.forEach(x => { h += '<div class="w3 sepl v"><span>' + rows[n].pen[x] + '</span></div><div class="w3 v p-' + x + '"><span>' + rows[n].prio[x] + '</span></div>'; });
      h += '</div>';
    }
    $('tbl').innerHTML = h; tr.push(...$('tbl').querySelectorAll('.tr'));
    let s = '';
    [['A', 6, 'die Hälfte'], ['B', 3, 'ein Viertel'], ['C', 3, 'ein Viertel']].forEach(r => {
      s += '<div><i style="background:var(--p' + r[0] + ')">' + r[0] + '</i><u style="background:var(--p' + r[0] + ');--w:' + r[1] * 36 + 'px"></u><span><b>' + r[1] + ' von 12</b> Zeitscheiben = ' + r[2] + '</span></div>';
    });
    $('share').innerHTML = s;
  })();

  /* ---------- Zeichnen ---------- */
  let scene = null, lastPen = {};
  function draw(st, instant) {
    if (instant) stage.classList.add('noanim');
    const f = F[st.f], demo = !!st.demo, vals = demo ? 0 : f.vals, picks = demo ? 0 : f.picks;
    $('g-cards').classList.toggle('off', st.v < 1 || st.res >= 2);
    $('g-line').classList.toggle('off', st.v < 2);
    $('g-strip').classList.toggle('off', st.v < 3);
    $('g-steps').classList.toggle('off', st.v < 5);
    $('g-tbl').classList.toggle('off', st.v < 5);
    $('share').classList.toggle('off', !(st.res >= 2));
    const act = st.v < 5 && !demo ? 0 : { pen: 1, half: 2, prio: 3, pick: 4 }[f.ph];
    [...$('steps').children].forEach((s, i) => s.classList.toggle('on', st.v >= 5 && !st.res && i + 1 === act && !(f.n === 0 && f.ph === 'prio')));
    N.forEach(n => {
      const c = card[n], rw = c.querySelectorAll('.rw'), isWin = f.win === n;
      c.className = 'card' + (st.v < 4 ? ' norows' : '') + (isWin && f.ph === 'pick' && !st.res ? ' win' : '') + (isWin && (f.ph === 'pen' || f.ph === 'half') ? ' ran' : '');
      c.querySelector('.bd').textContent = f.ph === 'pick' ? 'dran' : 'hat gerechnet';
      const pb = rw[0].children[1];
      if (!instant && lastPen[n] != null && lastPen[n] !== f.pen[n]) { pb.classList.remove('pop'); void pb.offsetWidth; pb.classList.add('pop'); }
      pb.textContent = f.pen[n]; lastPen[n] = f.pen[n];
      rw[0].children[2].textContent = f.cp[n] || '';
      rw[1].children[1].textContent = f.prio[n];
      rw[1].children[2].textContent = f.cr[n] || '';
      rw[1].classList.toggle('stale', f.ph === 'pen' || f.ph === 'half');
      tok[n].style.left = X(BASE[n] + f.pen[n]) - 14 + 'px';
      tok[n].classList.toggle('win', isWin && f.ph === 'pick' && !st.res && !demo);
      bar[n].style.width = f.pen[n] * 8.2 + 'px';
    });
    for (let n = 0; n < ROWS; n++) {
      const i = sc[n].firstChild, g = st.ghost;
      sc[n].className = 'sc' + (g ? ' ghost' : n < picks ? ' on' : '');
      if (g || n < picks) { const w = g ? 'A' : rows[n].pick; i.textContent = w; i.style.background = 'var(--p' + w + ')'; }
      i.style.transitionDelay = g && !instant ? n * 0.12 + 's' : '0s';
      const r = tr[n];
      r.classList.toggle('cur', n === vals - 1 && !st.res);
      r.classList.toggle('same', st.res >= 3 && ((n >= 6 && n <= 8) || n >= 10));
      r.querySelectorAll('.v').forEach(d => d.classList.toggle('on', n < vals));
      r.querySelector('.pk').classList.toggle('on', n < picks);
      N.forEach(x => r.querySelector('.p-' + x).classList.toggle('min', n < picks && rows[n].pick === x));
    }
    gb.forEach(b => b.classList.toggle('on', st.res >= 1));
    if (instant) { void stage.offsetWidth; stage.classList.remove('noanim'); }
  }

  /* ---------- Abspielen ---------- */
  let timers = [], busy = false, target = null;
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  const stop = () => { timers.forEach(clearTimeout); timers = []; };
  const endPlay = () => { busy = false; draw(target, false); ui(); };
  function finish() { stop(); busy = false; draw(target, true); ui(); }
  const DUR = { pen: 1500, half: 1500, prio: 1400, pick: 1200 };
  function play(from, to) {
    busy = true; target = to; ui();
    if (to.f > from.f && !to.demo && !from.demo) {
      const k = to.f - from.f > 6 ? 0.6 : 1; let i = from.f + 1;
      const step = () => { draw({ ...to, f: i }, false); const d = DUR[F[i].ph] * k; if (i >= to.f) later(d, endPlay); else { i++; later(d, step); } };
      step();
    } else { draw(to, false); later(to.ghost ? 2200 : 1300, endPlay); }
  }

  /* ---------- Die Teile ---------- */
  const S = [
    { dot: '1', act: 'Aufgabe 2 · Die Idee', title: 'Round Robin mit Prioritäten, die sich ändern', v: 0, beats: [
      { say: 'In Aufgabe 1 d) waren bei Round Robin alle gleich wichtig. Jetzt hat jeder Prozess eine <b>Basispriorität</b>: A 18, B 33, C 27.', v: 1 },
      { say: 'Achtung: <b>Kleine Zahl heißt wichtiger.</b> Auf der Linie steht der wichtigste Prozess ganz links. Wer am weitesten links steht, bekommt die nächste Zeitscheibe.', v: 2, anim: 1 },
      { say: 'Würde nur die Basis zählen, stünde A immer links. A bekäme jede Zeitscheibe, B und C würden <b>verhungern</b>.', v: 3, ghost: 1, anim: 1 },
      { say: 'Deshalb gibt es eine <b>Strafe</b>, die Penalty: Wer eine Zeitscheibe benutzt hat, bekommt 42 dazu. Die Strafe schiebt ihn nach rechts.', v: 4, ghost: 0, demo: 1, f: fi(1, 'pen'), anim: 1 },
      { say: 'Vor jeder neuen Zeitscheibe wird jede Strafe <b>halbiert</b>. Wer warten muss, erholt sich also Stück für Stück. Das ist das <b>Feedback</b>.', f: fi(1, 'half'), anim: 1 },
      { say: 'Aus beidem entsteht die Priorität: <b>Priorität = Penalty + Basis</b>. Bei A: 21 + 18 = 39. Das sind die zwei Zeilen Code vom Aufgabenblatt.', v: 5, f: fi(1, 'prio'), anim: 1 },
      { say: 'Noch ein Detail: Der Computer teilt <b>ganzzahlig</b>. 21 / 2 ist 10 und nicht 10,5. Der Rest fällt einfach weg.' }
    ] },
    { dot: '2', act: 'Aufgabe 2 · Zeitscheibe 0 bis 2', title: 'Langsam: die ersten Zeilen der Tabelle', v: 9, f: 0, beats: [
      { say: 'Jetzt richtig, von vorne. Alle Strafen sind 0, also ist die Priorität gleich der Basis. Rechts füllen wir dieselbe Tabelle wie auf dem Blatt.' },
      { say: 'Wer bekommt Zeitscheibe 0? Die kleinste Zahl gewinnt. Das ist A mit 18.', to: [0, 'pick'] },
      { say: '<b>Schritt 1:</b> A hat eine Zeitscheibe benutzt und bekommt die Strafe. 0 + 42 = 42. A fliegt weit nach rechts.', to: [1, 'pen'] },
      { say: '<b>Schritt 2:</b> Alle Strafen werden halbiert. A: 42 / 2 = 21. Bei B und C bleibt es bei 0 / 2 = 0.', to: [1, 'half'] },
      { say: '<b>Schritt 3:</b> Priorität = Penalty + Basis. A: 21 + 18 = 39. B bleibt bei 33, C bei 27. Das ist Zeile 1 der Tabelle.', to: [1, 'prio'] },
      { say: '<b>Schritt 4:</b> Wer steht jetzt am weitesten links? C mit 27. C bekommt Zeitscheibe 1, obwohl A die bessere Basis hat.', to: [1, 'pick'] },
      { say: 'Nächste Runde. <b>Schritt 1:</b> Diesmal hat C gerechnet, also bekommt C die Strafe: 0 + 42 = 42.', to: [2, 'pen'] },
      { say: '<b>Schritt 2:</b> Alle halbieren. C: 42 / 2 = 21. A hat gewartet und erholt sich: 21 / 2 = 10, der Rest fällt weg.', to: [2, 'half'] },
      { say: '<b>Schritt 3:</b> A: 10 + 18 = 28. B: 0 + 33 = 33. C: 21 + 27 = 48.', to: [2, 'prio'] },
      { say: '<b>Schritt 4:</b> Kleinste Zahl ist A mit 28. A ist schon wieder dran, B wartet immer noch.', to: [2, 'pick'] }
    ] },
    { dot: '3', act: 'Aufgabe 2 · Zeitscheibe 3 bis 12', title: 'Schneller: die Tabelle füllen', v: 9, f: fi(2, 'pick'), beats: [
      { say: 'Ab jetzt eine ganze Zeile pro Klick. Zeitscheibe 3: A wird bestraft, (10 + 42) / 2 = 26, also Priorität 44. Jetzt ist endlich B mit 33 der Kleinste.', to: [3, 'pick'] },
      { say: 'Zeitscheibe 4: B wird bestraft und springt auf 54. A erholt sich auf 13 + 18 = 31, C auf 5 + 27 = 32. A gewinnt ganz knapp vor C.', to: [4, 'pick'] },
      { say: 'Zeitscheibe 5: A wird bestraft, (13 + 42) / 2 = 27, also 45. C erholt sich weiter: 5 / 2 = 2, also 29. C ist dran.', to: [5, 'pick'] },
      { say: 'Zeitscheibe 6: Rechnet zuerst selbst. Wer hat zuletzt gerechnet, und wer steht danach am weitesten links?', to: [6, 'pick'] },
      { say: 'Zeitscheibe 7: Und jetzt? Tipp: A wird wieder bestraft, und B hat sich lange erholt.', to: [7, 'pick'] },
      { say: 'Zeitscheibe 8: A ist dran. Die Zeile sieht fast aus wie Zeile 4. Nur B hat 22 statt 21. Das kommt vom Abrunden.', to: [8, 'pick'] },
      { say: 'Zeitscheibe 9: A wird bestraft, C steht mit 29 ganz links.', to: [9, 'pick'] },
      { say: 'Die letzten drei Zeilen laufen jetzt am Stück durch. Achtet darauf: Zeile 10 wird genau gleich wie Zeile 6.', to: [12, 'pick'] }
    ] },
    { dot: '=', act: 'Aufgabe 2 · Ergebnis', title: 'Was zeigt die Tabelle?', v: 9, f: LAST, beats: [
      { say: 'Die Reihenfolge ist immer dieselbe: <b>A, C, A, B</b>, und dann wieder von vorne.', res: 1, anim: 1 },
      { say: 'In den Zeitscheiben 0 bis 11 bekommt A die Hälfte der CPU, B und C je ein Viertel. Die Basispriorität bestimmt also den <b>Anteil</b>, nicht die Reihenfolge allein.', res: 2, anim: 1 },
      { say: 'Die Strafen wachsen nicht immer weiter. Durch das Halbieren pendeln sie sich ein: Zeile 10 bis 12 sind gleich wie Zeile 6 bis 8. A pendelt zwischen 13 und 27.', res: 3, anim: 1 },
      { say: 'Der Unterschied zu Priority Scheduling aus Aufgabe 1 b): Dort kann ein unwichtiger Prozess ewig warten. Hier kommt <b>jeder dran</b>, nur unterschiedlich oft. Klassische UNIX-Systeme haben ähnlich geplant.' }
    ] }
  ];

  function expand(sc) {
    const steps = [];
    let st = { f: sc.f || 0, v: sc.v, ghost: 0, demo: 0, res: 0 };
    sc.beats.forEach(b => {
      const nx = { ...st };
      if (b.to) nx.f = fi(b.to[0], b.to[1]);
      ['f', 'v', 'ghost', 'demo', 'res'].forEach(k => { if (b[k] != null) nx[k] = b[k]; });
      if (b.to || b.anim) { steps.push({ say: b.say, st: { ...st } }); steps.push({ say: b.say, st: nx, play: true }); }
      else steps.push({ say: b.say, st: nx, soft: true });
      st = nx;
    });
    return steps;
  }

  let cur = 0, k = 0, steps = [];
  const dots = $('dots');
  S.forEach((s, i) => { const d = document.createElement('button'); d.className = 'dot'; d.textContent = s.dot; d.title = s.title; d.onclick = () => show(i); dots.appendChild(d); });
  function ui() {
    const nx = steps[k + 1];
    $('next').textContent = busy ? 'läuft …' : nx && nx.play ? 'Zeigen →' : 'Weiter →';
    $('next').classList.toggle('play', !busy && !!(nx && nx.play));
    $('next').disabled = !busy && !nx && cur === S.length - 1;
    $('prev').disabled = cur === 0 && k === 0;
    $('cnt').textContent = 'Schritt ' + (k + 1) + ' / ' + steps.length;
  }
  function go(j, anim) {
    const from = steps[k] ? steps[k].st : null, s = steps[j]; k = j;
    $('say').innerHTML = s.say;
    stop(); busy = false; target = s.st;
    if (anim && s.play && from) play(from, s.st);
    else draw(s.st, !(anim && s.soft));
    ui();
  }
  function show(i, last) {
    stop(); busy = false; cur = i; scene = S[i]; steps = expand(scene);
    $('act').textContent = scene.act; $('ttl').textContent = scene.title;
    [...dots.children].forEach((d, n) => { if (n === cur) d.setAttribute('aria-current', 'step'); else d.removeAttribute('aria-current'); });
    k = 0; go(last ? steps.length - 1 : 0, false);
  }
  function next() {
    if (busy) return finish();
    if (k < steps.length - 1) go(k + 1, true); else if (cur < S.length - 1) show(cur + 1);
  }
  function prev() {
    if (busy) finish();
    if (k > 0) go(k - 1, false); else if (cur > 0) show(cur - 1, true);
  }
  $('next').onclick = next; $('prev').onclick = prev; $('replay').onclick = () => show(cur);
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'r' || e.key === 'R') show(cur);
  });

  function fit() {
    const w = box.clientWidth, s = Math.max(0.5, Math.min(w / 1000, (window.innerHeight - 250) / 380, 1.6));
    stage.style.transform = 'scale(' + s + ')'; stage.style.left = (w - 1000 * s) / 2 + 'px'; box.style.height = 380 * s + 'px';
  }
  window.addEventListener('resize', fit);
  window.__go = (i, j) => { show(i); if (j) go(Math.min(j, steps.length - 1), false); };
  window.__rows = rows;
  fit(); show(0);
})();
</script>
