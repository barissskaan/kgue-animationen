<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f4f2ec;--ink:#16181d;--muted:#6b7078;--line:#dcd7cb;--card:#fbfaf6;--mark:#ffd400;--mark-soft:#fff3b0;
  --k1:#2f8fb0;--k2:#4f9a3f;--k3:#c9781f;--k4:#8a5bb5;--k5:#d24a3e;
  --disp:"Space Grotesk",system-ui,sans-serif;--sans:"Inter",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --col:392px;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(#d6d1c4 1px,transparent 1.2px);background-size:24px 24px;overflow:hidden}
a{color:inherit}button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.top{position:fixed;left:0;right:0;top:0;height:68px;display:flex;align-items:center;gap:14px;padding:0 28px 0 34px;z-index:30}
.wm{display:flex;align-items:center;gap:10px;font:600 12.5px/1 var(--mono);letter-spacing:.08em;text-decoration:none}
.wm i{display:grid;gap:2.5px}.wm i b{display:block;width:16px;height:3.5px;border-radius:1px;background:var(--ink)}.wm i b:nth-child(2){background:var(--mark)}
.top nav{margin-left:auto;display:flex;gap:6px}
.tb{font:600 12.5px/1 var(--mono);text-decoration:none;border:1.5px solid transparent;border-radius:999px;padding:9px 13px;background:transparent;cursor:pointer;color:var(--muted)}
.tb:hover{color:var(--ink);border-color:var(--ink);background:var(--card)}
.tb.k{background:var(--ink);color:#fff}
.switch{position:absolute;left:50%;transform:translateX(-50%);display:flex;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:4px;box-shadow:0 4px 0 var(--ink)}
.switch::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:136px;border-radius:999px;background:var(--mark);transition:transform .45s var(--ease)}
body.ueb .switch::before{transform:translateX(136px)}
body.ueb.to-sch .switch::before{transform:none}
.switch button{position:relative;min-width:136px;border:0;background:transparent;border-radius:999px;padding:10px 12px;font:600 14px var(--sans);display:flex;justify-content:center;align-items:center;gap:8px;cursor:pointer}
.switch svg{width:17px;height:17px}

/* ---------- layout ---------- */
.app{position:fixed;inset:68px 0 0 0;display:grid;grid-template-columns:var(--col) minmax(0,1fr)}
.col{position:relative;padding:14px 22px 20px 34px;display:flex;flex-direction:column;min-height:0;z-index:12}
.views{flex:1;min-height:0;overflow-y:auto;padding-right:6px}
.views::-webkit-scrollbar{width:6px}.views::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
h1{font:700 clamp(26px,2.1vw,30px)/1.08 var(--disp);letter-spacing:-.03em;margin:6px 0 10px}
.lead{color:#474b52;margin:0 0 18px;max-width:34ch}
.kg-caption{font:700 26px/1.15 var(--disp);letter-spacing:-.02em;color:var(--ink);margin:0 0 12px}

.btn{font:600 12.5px/1 var(--mono);border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--mark)}
.btn svg{width:13px;height:13px}
.btn kbd{font:600 10px/1 var(--mono);border:1px solid var(--line);border-radius:4px;padding:2px 4px;color:var(--muted)}

/* ---------- exercise navigation ---------- */
.journey{margin-bottom:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.journey .lead{margin:0;max-width:none;font-size:14.5px;line-height:1.45;text-wrap:balance}
.journey .btn{padding:8px 11px}
body.ueb .journey{display:none}
body.ueb.to-sch .journey{display:grid}
.kg{display:grid;gap:10px}
.kg button{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.kg button:hover{background:var(--mark-soft);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.kg button.on{background:var(--ink);color:#fff}
.knum{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font:700 18px var(--disp)}
.kg b{font:600 15.5px/1.25 var(--sans)}
.kbars{display:flex;gap:3px}.kbars i{width:5px;height:16px;border-radius:2px;background:var(--c)}
.col>.who{flex:none;margin:18px 0 0;font-size:12px}

/* ---------- exercise cards ---------- */
.stage-cell{position:relative;min-width:0;min-height:0}
#ueb{position:absolute;inset:0;overflow-y:auto;scrollbar-gutter:stable;padding:10px 34px var(--tail,60px) 16px;visibility:hidden;opacity:0;transition:opacity .15s;z-index:20}
body.ueb #ueb{visibility:visible;opacity:1}
.krow{border-top:1.5px solid var(--line);padding:18px 0 22px}
.khead{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.khead .knum{width:44px;height:44px;font-size:20px}
.khead h3{font:700 26px/1.15 var(--disp);letter-spacing:-.03em;margin:0}
.kcards{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.kcard{width:264px;flex:none;background:var(--card);border:1.5px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.kcard.pick{box-shadow:0 5px 0 var(--ink),0 0 0 4px var(--mark)}
.kart{position:relative;z-index:2;height:150px;border-radius:14px 14px 0 0;overflow:hidden;border-bottom:1.5px solid var(--ink);background:var(--surface)}
.kart svg{display:block;width:100%;height:100%}
.klinks a{display:grid;grid-template-columns:auto 1fr 18px;gap:10px;align-items:center;padding:12px 14px;text-decoration:none;font:600 15px var(--sans)}
.klinks a+a{border-top:1px solid var(--line)}
.klinks small{font:600 10px var(--mono);text-transform:uppercase;border-radius:6px;padding:5px 7px;background:#ece8de}
.klinks small.l{background:var(--mark)}
.klinks svg{width:18px;height:18px}
.klinks a:hover{background:var(--mark)}
.klinks a:last-child{border-radius:0 0 14px 14px}
.kcard.wide{width:544px;max-width:100%;display:grid;grid-template-columns:264px 1fr}
.wide .kart{height:100%;min-height:170px;border-bottom:0;border-right:1.5px solid var(--ink);border-radius:14px 0 0 14px}
.wide .klinks a:first-child{border-top-right-radius:14px}
.wide .klinks a:last-child{border-bottom-left-radius:0}
body.flying #ueb{pointer-events:none;transition:none}
body.flying .kart{transform-origin:0 0;will-change:transform}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;height:100%;perspective:3400px;perspective-origin:50% 45%;min-width:0}
.stage.away{opacity:0}
.stack{position:absolute;left:50%;top:50%;width:760px;height:440px;margin:-220px 0 0 -380px;transform-style:preserve-3d;
  transform:translate(var(--ox,70px),var(--oy,0px)) scale(var(--s,.85)) rotateX(57deg) rotateZ(-10deg);transition:transform 1s var(--ease)}
.stack.flat{transform:translate(0px,6px) scale(var(--sf,1.2)) rotateX(0deg) rotateZ(0deg)}
.slab{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(var(--z));transition:transform .9s var(--ease),opacity .5s ease;cursor:pointer}
.slab.hov{transform:translateZ(calc(var(--z) + 16px))}
/* Hidden slabs never share the open slab's plane and are taken out of rendering once faded (iOS drew the middle slab over the open one). */
.stack.flat .slab{opacity:0;visibility:hidden;pointer-events:none;transform:translateZ(calc(var(--z) * 1.8 - 60px));transition:transform .9s var(--ease),opacity .5s ease,visibility 0s .5s}
.stack.flat .slab.foc{opacity:1;visibility:visible;pointer-events:auto;transform:translateZ(0);cursor:default;transition:transform .9s var(--ease),opacity .5s ease}
.face,.ex{position:absolute;inset:0;border-radius:22px}
.face{overflow:hidden;background:var(--card)}
.face svg{display:block;width:100%;height:100%}
.ex{background:var(--edge,#b9b4a6)}
.shadow{position:absolute;inset:-4% -2%;border-radius:40%;background:radial-gradient(closest-side,rgba(22,24,29,.36),rgba(22,24,29,0));transform:translateZ(-460px);filter:blur(22px);transition:opacity .5s;pointer-events:none}
.stack.flat .shadow{opacity:0}
.stack.notrans,.stack.notrans .slab,.stack.notrans .shadow{transition:none!important}
.an{position:absolute;width:0;height:0;pointer-events:none}
.face [data-stop]{cursor:pointer}

/* ---------- laptop intro ---------- */
.laptop,.lap-keyboard,.lap-bottom,.lap-lid{position:absolute;inset:0;transform-style:preserve-3d}
.laptop{pointer-events:none}
.lap-lid,body.intro .slab[data-layer="apps"]{transform-origin:50% 100%}
.lap-deck,.lap-cover,.lap-screen,.lap-sole{position:absolute;inset:0;border-radius:22px}
.lap-deck,.lap-cover,.lap-sole{background:linear-gradient(155deg,#e6e3dc,#c9c5bb);border:1px solid #a9a59b;
  box-shadow:inset 0 1px rgba(255,255,255,.7),inset 0 -1px rgba(80,76,65,.16)}
.lap-deck svg{display:block;width:100%;height:100%}
.lap-cover{transform:translateZ(-6px) rotateX(180deg);backface-visibility:hidden}
.lap-screen{transform:translateZ(-.6px);backface-visibility:hidden;background:#15171c;box-shadow:inset 0 0 0 10px #2d2f34}
.lap-screen::after{content:"";position:absolute;inset:10px;border-radius:14px;
  background:linear-gradient(122deg,transparent 44%,rgba(215,229,255,.085) 44%,transparent 68%)}
.lap-edge{--edge:#a9a59b;transform:translateZ(var(--edge-z))}
.lap-keyboard .lap-edge,.lap-sole,.lap-bottom .lap-edge{inset:-2px}
.lap-glow{position:absolute;top:24px;left:90px;right:90px;height:195px;border-radius:28px;background:#c8d9ff;
  filter:blur(26px);mix-blend-mode:screen}
.lap-terminal{position:absolute;overflow:hidden;border-radius:10px;transform-origin:0 0;
  background:#15171c;box-shadow:0 0 0 1px #4b4e55,0 8px 30px rgba(0,0,0,.25);font:500 18px var(--mono)}
.lap-cursor{animation:lap-blink .7s steps(1,end) infinite}
@keyframes lap-blink{50%{opacity:0}}
body.intro .stack,body.intro .slab,body.intro #labels,body.intro #fx{transition:none}

/* ---------- overlay: labels + signal ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:14;transition:opacity .2s}
#labels{position:fixed;inset:0;pointer-events:none;z-index:16;transition:opacity .2s}
body.ueb #labels,body.ueb #fx{opacity:0;pointer-events:none}
body.ueb #labels .lb{pointer-events:none}
.lb{position:absolute;left:0;top:0;pointer-events:auto;white-space:nowrap;will-change:transform;transition:opacity .35s}
.lb.off{opacity:0;pointer-events:none}
.lb.stop{display:flex;align-items:center;gap:7px;font:600 12.5px/1 var(--sans);background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:6px 11px 6px 8px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.lb.stop i{width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:600 10.5px var(--mono);font-style:normal}
.lb.stop .short{display:none}
.lb.stop::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:var(--stem,30px);margin-top:3px;background:var(--ink)}
.lb.stop::before{content:"";position:absolute;left:50%;top:calc(100% + var(--stem,30px) + 1px);width:7px;height:7px;margin-left:-2.75px;border-radius:50%;background:var(--ink)}
.lb.stop:hover,.lb.stop.on{background:var(--mark)}
.flat .lb.stop{font-size:14px;padding:8px 14px 8px 10px}
.flat .lb.stop::after,.flat .lb.stop::before{display:none}
.lb.slot{font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg);border:1.5px dashed #a9a59a;border-radius:999px;padding:5px 9px;pointer-events:none}
.lb.layer{text-align:right;cursor:pointer;background:transparent;border:0;padding:6px 14px 6px 6px;border-right:1.5px solid var(--ink)}
.lb.layer .no{font:600 11px/1 var(--mono);letter-spacing:.1em;color:var(--muted)}
.lb.layer b{display:block;font:700 19px/1.15 var(--disp);letter-spacing:-.02em;margin:4px 0 2px}
.lb.layer span{display:block;font:400 12.5px/1.35 var(--sans);color:var(--muted);white-space:normal;width:170px;margin-left:auto}
.lb.layer em{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font:600 10.5px/1 var(--mono);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:4px 7px 4px 9px;box-shadow:0 2px 0 var(--ink);transition:background-color .15s,transform .15s,box-shadow .15s}
.lb.layer em svg{width:9px;height:9px}
.lb.layer:hover em,.lb.layer.on em{background:var(--mark);transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.opens{display:none}
.lb.layer:hover b,.lb.layer.on b{background:linear-gradient(var(--mark),var(--mark)) no-repeat 0 88%/100% 42%}
.foc-bar{position:fixed;left:calc(var(--col) + (100vw - var(--col)) / 2);top:82px;transform:translateX(-50%);z-index:18;transition:opacity .2s}
body.ueb .foc-bar{opacity:0;pointer-events:none}

.who{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
.who b{color:var(--ink)}

/* ---------- compact layout ---------- */
.layer-names{display:none}
@media (max-width:980px){
  html,body{height:auto;min-height:100%}
  body{overflow:auto;background-size:22px 22px;--side:clamp(16px,5vw,28px)}
  .top,.app{padding-left:max(var(--side),env(safe-area-inset-left));padding-right:max(var(--side),env(safe-area-inset-right))}
  .top{position:relative;inset:auto;height:calc(64px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);gap:8px}
  .tb{display:grid;place-items:center;min-height:48px}
  #fx,.switch,.top nav .opt,.col .journey,.col .kg{display:none!important}
  .app{position:static;display:block;max-width:760px;margin:auto;padding-bottom:calc(36px + env(safe-area-inset-bottom) + var(--jump-tail,0px))}
  .col,.views{display:block;overflow:visible;padding:0}
  h1{font-size:clamp(30px,5.5vw,42px);margin:6px 0 0}
  .stage{height:auto;max-height:620px;aspect-ratio:1;margin:auto;overflow:clip}
  .shadow{inset:0 1% 20%}
  .stack.flat .slab:not(.foc) .hit{pointer-events:none}
  .stack.flat .slab.foc{cursor:pointer}
  .stack.flat .face .slot{cursor:default}
  .stack.flat .slab.foc .slot rect{pointer-events:all}
  #labels{position:absolute}
  #labels .lb.layer{display:none}
  #labels .lb{visibility:hidden;transition:none}
  #labels.flat .lb:not(.off){visibility:visible}
  #labels .lb.stop{min-height:32px;gap:5px;font-size:12px;padding:5px 6px}
  #labels .lb.slot{font-size:10px;padding:4px 6px}
  .foc-bar{position:absolute;left:50%;top:calc(50% - var(--flat-half-height) - 6px);transform:translate(-50%,-100%);white-space:nowrap}
  .layer-names{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;list-style:none;margin:12px 0 28px;padding:0;font:600 11.5px/1 var(--mono)}
  .layer-names button{font:inherit;color:var(--ink);border:1.5px solid var(--ink);background:var(--card);padding:9px 11px;border-radius:999px;box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s,background-color .15s}
  .layer-names button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .layer-names button[aria-pressed="true"]{background:var(--mark);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .opens{display:block;transition:opacity .3s}
  .opens button{position:absolute;left:8px;transform:translateY(-50%);display:inline-flex;align-items:center;gap:3px;font:600 8px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:var(--card);border:1px solid var(--ink);border-radius:999px;padding:3px 4px 3px 6px;box-shadow:0 2px 0 var(--ink);cursor:pointer}
  .opens button::before{content:"";position:absolute;inset:-14px}
  .opens button:active{background:var(--mark);box-shadow:0 1px 0 var(--ink)}
  .opens svg{width:6px;height:6px}
  .stack.flat ~ .opens,body.intro .opens{opacity:0;pointer-events:none}
  #ueb{position:static;overflow:visible;scrollbar-gutter:auto;padding:0;visibility:visible;opacity:1;transition:none}
  .kcards{display:grid;justify-items:center;grid-template-columns:minmax(0,1fr)}
  .kcard,.kcard.wide{display:block;width:100%;max-width:520px;min-width:0}
  .kart,.wide .kart{height:auto;aspect-ratio:2 / 1;min-height:150px;max-height:220px;border:0;border-bottom:1.5px solid var(--ink);border-radius:14px 14px 0 0}
  .klinks a{min-height:48px;grid-template-columns:auto minmax(0,1fr) 18px;overflow-wrap:anywhere}
  .wide .klinks a:first-child{border-top-right-radius:0}
  .wide .klinks a:last-child{border-bottom-left-radius:14px}
  .who{margin:12px 0 0}
}
@media (max-width:400px){
  .lb.stop .full{display:none}
  .lb.stop .short{display:inline}
}
@media (max-width:980px) and (prefers-reduced-motion:no-preference){
  /* Give the projected labels time to separate as the slab turns flat. */
  #labels.flat .lb:not(.off){transition:visibility 0s .65s}
  .stack.hint .slab{animation:compact-lift .65s var(--ease)}
  .stack.hint .slab[data-layer="os"]{animation-delay:.1s}
  .stack.hint .slab[data-layer="hw"]{animation-delay:.2s}
}
@keyframes compact-lift{
  0%,100%{transform:translateZ(var(--z))}
  45%{transform:translateZ(calc(var(--z) + 12px))}
}
@media (700px <= width <= 980px){
  .kcards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kcard:only-child{grid-column:1 / -1}
}
body.instant-view #ueb,body.instant-view #labels,body.instant-view #fx,body.instant-view .foc-bar,body.instant-view .switch::before{transition:none}
@media (prefers-reduced-motion:reduce){.stack,.slab,.stack.flat .slab,.stack.flat .slab.foc,#ueb,#labels,#fx,.foc-bar,.switch::before{transition:none}}
</style>
</head>
<body>

<header class="top">
  <a class="wm" href="./"><i><b></b><b></b><b></b></i>GIN3 · KGÜ-ANIMATIONEN</a>
  <div class="switch" role="group" aria-label="Ansicht">
    <button id="schBtn" type="button" aria-pressed="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="m2 6 8-4 8 4-8 4-8-4Zm0 4 8 4 8-4M2 14l8 4 8-4"/></svg>Schichten</button>
    <button id="uebBtn" type="button" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="12" y="2" width="6" height="6" rx="1"/><rect x="2" y="12" width="6" height="6" rx="1"/><rect x="12" y="12" width="6" height="6" rx="1"/></svg>Übungen</button>
  </div>
  <nav>
    <a class="tb" data-z="zip" href="KGUE-Animationen.zip" download>Zip</a>
    <a class="tb opt" href="https://github.com/barissskaan/kgue-animationen">GitHub</a>
  </nav>
</header>

<main class="app">
  <section class="col">
    <div class="views">
      <h1>Ein Computer,<br>Schicht für Schicht.</h1>
      <div class="journey">
        <p class="lead">Sieh zu, wie ein Programm beim Start durch alle drei Schichten läuft.</p>

  Array.from(bottom.children).forEach(function (part) { fade(part, 1, 0, 2510, 2890, 'ease-in-out'); });

  animatePart(stack.querySelector('.shadow'), [
    { transform: z(baseZ - 62) + ' scale(.86,.8)' }, { transform: z(-460) + ' scale(1)' }
  ], enter, rest, lift);
  var entrance = animatePart(stack, [
    { transform: 'translate(var(--ox,70px),calc(var(--oy,0px) + 36px)) scale(calc(var(--s,.85) * .82)) rotateX(57deg) rotateZ(-10deg)' },
    { transform: 'translate(var(--ox,70px),var(--oy,0px)) scale(var(--s,.85)) rotateX(57deg) rotateZ(-10deg)' }
  ], 0, finish, 'cubic-bezier(.25,.45,.3,1)');
  if (small.matches) {
    // Keep the open lid inside the compact stage as it rises and becomes the apps slab.
    var drop = '0px calc(var(--s) * 104px)';
    animatePart(stack, [
      { translate: '0px 0px', easing: ease }, { translate: drop, offset: .3 },
      { translate: drop, offset: .66, easing: ease }, { translate: '0px 0px', offset: .88 },
      { translate: '0px 0px' }
    ], 0, finish, 'linear');
  } else {
    fade($('fx'), 0, 1, rest, finish, 'ease-in-out');
    fade(labels, 0, 1, rest, finish, 'ease-in-out');
  }
  entrance.onfinish = function () {
    stopIntro();
    if (!small.matches) beginStory();
  };
  return true;
}
function stopIntro() {
  if (!intro) return;
  intro.animations.forEach(function (animation) {
    animation.onfinish = null;
    animation.cancel();
  });
  intro.laptop.remove();
  intro = null;
  stack.getBoundingClientRect(); // Apply the rest pose while transitions are still disabled.
  document.body.classList.remove('intro');
  labels.inert = small.matches; stage.inert = false;
  if (small.matches && !motion.matches) stack.classList.add('hint');
}
function skipIntroIfNeeded(e) {
  if (!e.matches) return;
  if (intro) endStory();
  stack.classList.remove('hint');
}
motion.addEventListener('change', skipIntroIfNeeded);

small.addEventListener('change', function () {
  document.body.classList.add('instant-view');
  endStory();
  stack.classList.remove('hint');
  var flights = activeFlight;
  activeFlight = null;
  if (flights) flights.forEach(function (a) { a.cancel(); });
  transitioning = replayPending = false;
  document.body.classList.remove('flying', 'to-sch');
  cancelAnimationFrame(jumpFrame);
  app.style.removeProperty('--jump-tail');
  clearTimeout(pickTimer);
  cards.forEach(function (c) { c.el.classList.remove('pick'); c.clone.classList.remove('act'); });
  hovStop = null; hovK = 0;
  applyAct();
  LAYERS.forEach(function (L) { L.lb.classList.remove('on'); });
  originals(false);
  stage.classList.remove('away');
  viewState(false);
  placeContent();
  layout();
  resetStack();
  if (small.matches) compactFocusState();
  ueb.scrollTop = 0;
  window.scrollTo(0, 0);
  if (!small.matches && savedExercises()) switchView(true, 0, null, true);
  document.body.getBoundingClientRect();
  document.body.classList.remove('instant-view');
});

// ---------- entrance ----------
placeContent();
viewState(false);
layout();
stack.getBoundingClientRect();
stack.classList.remove('notrans');
// laptop intro on every real page load (F5, new visit); not when coming back via back/forward
var firstVisit = true;
try {
  var nav = performance.getEntriesByType('navigation')[0];
  if (nav && nav.type === 'back_forward') firstVisit = false;
} catch (e) {}
if (!small.matches && savedExercises()) switchView(true, 0, null, true);
else if (motion.matches) endStory();
else if (!firstVisit || !startIntro()) {
  if (small.matches) stack.classList.add('hint');
  else queueStory();
}
})();
</script>
