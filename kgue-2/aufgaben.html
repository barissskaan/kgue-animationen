<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KGÜ 2 · Aufgaben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Wie KGÜ-2_Stack.html und die KGÜ-5-Seiten: bewusst nur hell (Beamer). Bühne 1000×380, darunter Titel und Text.
   Regel: erst Text, Animation erst nach Klick. Keine Emoji.
   Die offizielle Lösung (kgloesung02) läuft in einem kleinen Simulator: Jeder Zustand wird ausgerechnet, nicht von Hand eingetippt.
   Links der Code (rip-Pfeil = nächster Befehl), Mitte die CPU als Chip mit Registern und Vergleichsanzeige, rechts der RAM mit .data und Stack. */
:root {
  color-scheme: light;
  --bg: #ffffff; --fg: #16181d; --muted: #5d6370; --line: #c9ced8; --soft: #f1f2f5;
  --warn: #c2410c; --hl: #fff1a8; --ptr: #ffd400; --cand: #2f5fb8; --rip: #7a4fd0;
  --chip: #2b303b; --chip2: #4a5163; --pin: #8a909c;
  --pcb: #2e6b3d; --pcb2: #1f4d2b; --gold: #c9a227;
  --main: #e3ecfb; --main-b: #2f5fb8;
  --ret: #fde8d7; --ret-b: #c2410c; --save: #dff1f4; --save-b: #0e7490;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 18px; line-height: 1.4; }
.wrap { max-width: 1500px; margin: 0 auto; padding: 10px 16px 10px; }
.top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; height: 24px;
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.top .act { color: var(--fg); }
/* Zusatzaufgabe e: deutlicher Hinweis oben links statt der normalen Überschrift */
/* Einblendung beim Öffnen von e1/e2: groß in der Mitte, Hintergrund verschwommen, dann fliegt sie nach oben links */
.xintro { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(22,24,29,0.38); -webkit-backdrop-filter: blur(5px) grayscale(0.6); backdrop-filter: blur(5px) grayscale(0.6); animation: xbg 1.25s ease forwards; cursor: pointer; }
.xintro .card { padding: 26px 44px; border: 4px solid var(--warn); border-radius: 22px; background: #ffe1d1; color: var(--warn); text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,0.35); animation: xcard 1.25s cubic-bezier(.3,1.3,.5,1) forwards; transform-origin: center; }
.xintro .card b { display: block; font-size: 48px; line-height: 1.1; }
.xintro .card span { display: block; margin-top: 10px; font-size: 24px; font-weight: 600; color: #8a2e08; }
@keyframes xbg { 0% { opacity: 0; } 12% { opacity: 1; } 72% { opacity: 1; } 100% { opacity: 0; } }
@keyframes xcard { 0% { transform: scale(0.6); opacity: 0; } 14% { transform: scale(1.04); opacity: 1; } 22% { transform: scale(1); } 70% { transform: scale(1); opacity: 1; } 100% { transform: translate(-36vw, -40vh) scale(0.3); opacity: 0; } }
.xwarn { display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px; border: 2.5px solid var(--warn); border-radius: 9px; background: #ffe1d1; color: var(--warn); font-size: 17px; font-weight: 700; text-transform: none; letter-spacing: 0; white-space: nowrap; }
/* Legende oben: Gelb = eben passiert, Lila (rip) = passiert als Nächstes */
.legend { display: flex; align-items: center; gap: 14px; font-size: 18px; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--fg); }
.legend > span { display: inline-flex; align-items: center; gap: 9px; padding: 3px 12px; border: 2px solid var(--fg); border-radius: 9px; background: #fff; white-space: nowrap; }
#cnt { white-space: nowrap; }
.legend .sw { width: 34px; height: 20px; background: var(--hl); border: 2px solid #e0c200; border-radius: 4px; }
.legend .tri { width: 0; height: 0; border-left: 17px solid var(--rip); border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
.top:has(.legend:not([hidden])) { height: 40px; align-items: center; }
.legend .rp { color: var(--rip); }
button { font: inherit; font-size: 16px; cursor: pointer; border-radius: 8px; border: 1.5px solid var(--fg); background: var(--bg); color: var(--fg); padding: 6px 14px; font-weight: 600; }
button:disabled { opacity: 0.35; cursor: default; }
button:focus-visible { outline: 3px solid var(--cand); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-variant-ligatures: none; }

.stagebox { position: relative; margin-top: 4px; }
.stage { position: absolute; left: 0; top: 0; width: 1000px; height: 380px; transform-origin: 0 0; }
.stage.noanim, .stage.noanim * { transition: none !important; animation: none !important; }

/* ---------- Code ---------- */
#code { position: absolute; left: 6px; top: 4px; width: 330px; height: 372px; border: 2px solid var(--fg); border-radius: 12px; overflow: hidden; background: #fff; }
#cline { position: relative; z-index: 2; height: 36px; border-bottom: 2px solid var(--fg); background: var(--soft); padding: 0 12px; display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 15.5px; font-weight: 600; white-space: nowrap; font-variant-ligatures: none; overflow: hidden; }
#cline small { font-family: var(--font-body); font-size: 12px; letter-spacing: 0.07em; color: var(--muted); }
.listing { position: absolute; left: 0; right: 0; top: 38px; bottom: 0; overflow: hidden; transition: opacity 0.5s; }
.listing.off { opacity: 0; pointer-events: none; }
.lsc { position: absolute; left: 0; right: 0; top: 2px; transition: transform 0.5s ease-in-out; }
.ln { position: relative; height: 18.6px; line-height: 18.6px; padding-left: 64px; font-family: var(--font-mono); font-size: 14.5px; white-space: pre; font-variant-ligatures: none; transition: background 0.3s; }
.ln .ad { position: absolute; left: 22px; width: 38px; color: var(--muted); font-size: 12px; }
.ln .cm { color: var(--muted); }
.ln.lab { font-weight: 600; padding-left: 26px; }
.ln.decl { color: var(--muted); padding-left: 26px; }
.ln.decl b { color: var(--fg); font-weight: 600; }
.ln.on { background: var(--hl); }
.rarrow { position: absolute; left: 4px; width: 0; height: 0; border-left: 13px solid var(--rip); border-top: 7.5px solid transparent; border-bottom: 7.5px solid transparent; transition: top 0.4s, opacity 0.3s; }

/* ---------- CPU als Chip ---------- */
.cpu { position: absolute; left: 380px; top: 22px; width: 224px; height: 338px; background: var(--chip); border: 3px solid var(--fg); border-radius: 16px; }
.cpu::before { content: ""; position: absolute; inset: 8px; border: 1.5px solid #555c6c; border-radius: 10px; }
.cpu .name { position: absolute; left: 16px; top: 12px; color: #fff; font-family: var(--font-mono); font-weight: 600; font-size: 15px; letter-spacing: 0.05em; }
.pin { position: absolute; background: repeating-linear-gradient(var(--dir, 0deg), var(--pin) 0 7px, transparent 7px 17px); }
.pin.l, .pin.r { top: 26px; bottom: 26px; width: 11px; }
.pin.l { left: -14px; } .pin.r { right: -14px; }
.pin.t, .pin.b { left: 26px; right: 26px; height: 11px; --dir: 90deg; }
.pin.t { top: -14px; } .pin.b { bottom: -14px; }
#regs { position: absolute; left: 18px; right: 18px; top: 42px; }
.reg { display: flex; align-items: center; height: 36px; margin-bottom: 6px; }
.reg .n { width: 46px; font-family: var(--font-mono); font-weight: 600; font-size: 15px; color: var(--ptr); }
.reg .n.rip { color: #c9b3ff; }
.reg .v { flex: 1; height: 34px; border-radius: 7px; background: #fff; border: 2px solid var(--pin); font-family: var(--font-mono); font-weight: 600; font-size: 17px; line-height: 30px; text-align: right; padding: 0 9px; transition: background 0.3s, border-color 0.3s; white-space: nowrap; overflow: hidden;  font-variant-ligatures: none; }
.reg .v.hot { background: var(--ptr); border-color: var(--fg); }
/* Ergebnis des letzten cmp: vereinfacht als kleiner / gleich / größer (in echt: Flag-Bits im Register rflags) */
.cmpflags { position: absolute; right: 16px; top: 9px; display: flex; align-items: center; gap: 4px; }
.cmpflags small { font-family: var(--font-mono); font-size: 11px; color: #c9ced8; letter-spacing: 0.06em; margin-right: 3px; font-weight: 600; }
.fl { width: 27px; height: 22px; border-radius: 5px; background: var(--chip2); border: 1.5px solid var(--pin); color: #c9ced8; font-family: var(--font-mono); font-weight: 600; font-size: 14px; line-height: 19px; text-align: center; transition: background 0.3s, color 0.3s, box-shadow 0.3s; }
.fl.lit { background: var(--ptr); color: var(--fg); border-color: var(--fg); }
.cmpflags.hot .fl.lit { box-shadow: 0 0 0 3px #fff; }
.alu { position: absolute; left: 50%; bottom: 16px; width: 170px; height: 68px; margin-left: -85px; }
.alu svg { position: absolute; inset: 0; overflow: visible; }
.alu b { position: absolute; left: -20px; right: -20px; top: 42px; text-align: center; font-family: var(--font-mono); font-size: 15px; color: #fff; white-space: nowrap;  font-variant-ligatures: none; }
.alu small { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-family: var(--font-mono); font-size: 16px; letter-spacing: 0.1em; color: #e1e4ea; font-weight: 600; }
.alu.on polygon { fill: #6b5a1a; stroke: var(--ptr); }
.alu polygon { transition: fill 0.3s, stroke 0.3s; }
.bus { position: absolute; height: 22px; display: flex; flex-direction: column; justify-content: space-between; }
.bus i { display: block; height: 3px; background: var(--pin); border-radius: 2px; }

/* ---------- RAM ---------- */
#ramstick, #zoom { display: none; }
/* der ganze C-Code oben rechts; gelb = die C-Zeile, zu der der eben ausgeführte Befehl gehört */
.cbox { position: absolute; left: 648px; top: 4px; width: 346px; border: 2px solid var(--fg); border-radius: 12px; background: #fff; overflow: hidden; }
.cbox.off { display: none; }
.cbox .hd { height: 24px; line-height: 22px; padding: 0 10px; background: var(--soft); border-bottom: 2px solid var(--fg); font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.cbox .cl { height: 17px; line-height: 17px; padding: 0 10px; font-family: var(--font-mono); font-size: 13.5px; white-space: pre; font-variant-ligatures: none; transition: background 0.3s; }
.cbox .cl.on { background: var(--hl); }
.cbox .cl .cm { color: var(--muted); }
.cnote { height: 30px; line-height: 28px; padding: 0 10px; background: #ffe1d1; border-top: 2px solid var(--warn); color: var(--warn); font-size: 15px; font-weight: 700; }
#mem { position: absolute; left: 0; top: 0; width: 1000px; height: 380px; pointer-events: none; }
.adr { position: absolute; left: 700px; width: 44px; text-align: right; font-family: var(--font-mono); font-size: 13.5px; color: var(--muted); }
.cell { position: absolute; left: 750px; width: 196px; border: 2px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-family: var(--font-mono); font-size: 14.5px; font-weight: 600; transition: background 0.35s, border-color 0.35s, color 0.35s;  font-variant-ligatures: none; }
.cell small { font-size: 11.5px; font-weight: 400; color: var(--muted); }
.cell.dat { background: var(--main); border-color: var(--main-b); }
.cell.ret { background: var(--ret); border-color: var(--ret-b); }
.cell.save { background: var(--save); border-color: var(--save-b); }
/* mit push auf den Stack gelegte Werte: eigene Farbe (grün), damit man sofort sieht, was neu dazugekommen ist */
.cell.val { background: #e4f4d8; border-color: #3f7d1c; color: #24520c; }
.cell.val small { color: #3f7d1c; font-weight: 600; }
.cell.stale { background: repeating-linear-gradient(135deg, #f3f4f6 0 6px, #e5e7eb 6px 12px); border-color: var(--line); color: #9aa0aa; }
.cell.stale small { color: #9aa0aa; }
.cell.hot { box-shadow: inset 0 0 0 3px var(--ptr); }
.cell.read { box-shadow: inset 0 0 0 3px var(--cand); }
.gap { position: absolute; left: 750px; width: 196px; text-align: center; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.mptr { position: absolute; font-family: var(--font-mono); font-weight: 600; font-size: 15px; white-space: nowrap; transition: top 0.4s, opacity 0.3s; }
#p-rsp { left: 952px; }
#p-rbp { left: 648px; color: var(--save-b); }
.grow { position: absolute; left: 744px; width: 256px; font-size: 12px; color: var(--muted); text-align: center; letter-spacing: 0.05em; }

/* fliegende Werte */
#fx { position: absolute; inset: 0; pointer-events: none; }
/* rip zeigt auf den nächsten Befehl: lila Zeiger vom rip-Register zur Zeile (wie auf der NASM-Seite) */
#rptr { position: absolute; left: 0; top: 0; width: 1000px; height: 380px; overflow: visible; pointer-events: none; transition: opacity 0.3s; }
#rptrp { fill: none; stroke: var(--rip); stroke-width: 3; stroke-linejoin: round; }
#rptr marker path { fill: var(--rip); stroke: none; }
.ln .ad.src { color: var(--rip); font-weight: 600; background: #ece4ff; border-radius: 3px; }
.fly { position: absolute; transform: translate(-50%, -50%); background: var(--ptr); border: 2px solid var(--fg); border-radius: 8px; padding: 2px 9px; font-family: var(--font-mono); font-weight: 600; font-size: 16px; white-space: nowrap; transition-property: left, top; transition-timing-function: ease-in-out; z-index: 9; box-shadow: 0 3px 8px rgba(0,0,0,0.25);  font-variant-ligatures: none; }
.fly.ripc { background: #ece4ff; border-color: var(--rip); }

/* Unterteil */
.cap { margin-top: 8px; min-height: 118px; }
.cap h1 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; font-weight: 600; }
.cap p { margin: 0; font-size: 21px; line-height: 1.35; max-width: 86ch; }
.cap code { font-size: 0.92em; background: var(--soft); border-radius: 4px; padding: 0 4px; }
.ctl { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.dot { min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; border-color: var(--line); font-family: var(--font-mono); font-size: 14px; }
.dot[aria-current="step"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
#next { min-width: 170px; background: var(--fg); color: var(--bg); margin-left: auto; }
#next.play { background: var(--ptr); color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="act" id="act"></span><span class="legend" id="legend"><span><i class="sw"></i>gelb = eben passiert</span><span><i class="tri"></i><b class="rp">rip</b> = kommt als Nächstes</span></span><span id="cnt"></span></div>
  <div class="stagebox" id="box">
    <div class="stage" id="stage">
      <div id="code"><div id="cline"></div></div>

      <div class="bus" style="left:338px;top:178px;width:42px"><i></i><i></i><i></i></div>
      <div class="bus" style="left:604px;top:178px;width:44px"><i></i><i></i><i></i></div>

      <div class="cpu" id="cpu">
        <div class="pin l"></div><div class="pin r"></div><div class="pin t"></div><div class="pin b"></div>
        <div class="name">CPU</div>
        <div class="cmpflags" id="flg"><small>cmp</small><span class="fl" id="fl-lt">&lt;</span><span class="fl" id="fl-eq">=</span><span class="fl" id="fl-gt">&gt;</span></div>
        <div id="regs"></div>
        <div class="alu" id="alu">
          <svg viewBox="0 0 170 68"><polygon points="0,0 70,0 85,14 100,0 170,0 134,68 36,68" fill="var(--chip2)" stroke="var(--pin)" stroke-width="2" stroke-linejoin="round"/></svg>
          <small>ALU</small><b id="alu-op"></b>
        </div>
      </div>

      <svg id="ramstick" viewBox="0 0 346 64" aria-hidden="true"></svg>
      <svg id="zoom" viewBox="0 0 360 100" aria-hidden="true"></svg>
      <div id="mem"></div>
      <svg id="rptr"><defs><marker id="rph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs><path id="rptrp" marker-end="url(#rph)"/></svg>
      <div id="fx"></div>
    </div>
  </div>
  <div class="cap"><h1 id="ttl"></h1><p id="say"></p></div>
  <div class="ctl">
    <button id="prev" aria-label="Zurück">←</button>
    <span id="dots" style="display:flex;gap:6px"></span>
    <button id="replay" aria-label="Teil neu starten" title="Teil neu starten (R)">↺</button>
    <button id="next">Weiter →</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), box = $('box'), fx = $('fx');
  const esc = x => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const clone = o => JSON.parse(JSON.stringify(o));

  /* ---------- RAM-Riegel (Zeichnung) mit Lupe auf einen Chip ---------- */
  (function drawStick() {
    let h = '<path d="M4 6 H342 V52 H186 V46 H176 V52 H4 Z" fill="var(--pcb)" stroke="var(--pcb2)" stroke-width="2.5"/>';
    for (let k = 0; k < 8; k++) h += '<rect x="' + (14 + k * 41) + '" y="12" width="33" height="26" rx="2" fill="var(--chip)"/>';
    for (let x = 10; x < 338; x += 6) { if (x > 172 && x < 190) continue; h += '<rect x="' + x + '" y="44" width="3.5" height="8" fill="var(--gold)"/>'; }
    h += '<rect x="' + (14 + 5 * 41 - 3) + '" y="9" width="39" height="32" rx="3" fill="none" stroke="var(--ptr)" stroke-width="2.5"/>';
    $('ramstick').innerHTML = h;
    const cx0 = 8 + 14 + 5 * 41 - 3, cx1 = cx0 + 39;
    $('zoom').innerHTML = '<path d="M' + cx0 + ' 41 L110 80 M' + cx1 + ' 41 L306 80" stroke="var(--ptr)" stroke-width="2" stroke-dasharray="5 4" fill="none"/>';
  })();

  /* ---------- Die offizielle Lösung (kgloesung02), Zeile für Zeile. Nach " | " steht die passende C-Zeile (nur für die Anzeige oben). ---------- */
  const SRC = {
    aif: `DEFAULT REL
SECTION .data
i DD 40
j DD 45
k DD 10
SECTION .text
global main
main:
; if (i > 42) k = 0;
; else if (j > 42) k = 1;
; else k = 2;
    cmp dword [i], 42 | if (i > 42)
    jle naechste | if (i > 42)
    mov dword [k], 0 | k = 0;
    jmp ende | k = 0;
naechste:
    cmp dword [j], 42 | else if (j > 42)
    jle letzte | else if (j > 42)
    mov dword [k], 1 | k = 1;
    jmp ende | k = 1;
letzte:
    mov dword [k], 2 | else k = 2;
ende:
    mov rax, 0 | return 0;
    ret | return 0;`,
    afor: `DEFAULT REL
SECTION .data
summe DD 0
SECTION .text
global main
main:
; int summe = 0;
; for (int i = 1; i <= 3; i++) {
;     summe += i;
; }
    mov ecx, 1          ; i = 1 | for (int i = 1; …)
schleife:
    cmp ecx, 3 | i <= 3
    jg ende             ; umgedreht! | i <= 3
    add dword [summe], ecx | summe += i;
    inc ecx | i++
    jmp schleife | for (…)
ende:
    mov rax, 0 | return 0;
    ret | return 0;`,
    b: `DEFAULT REL
SECTION .data
N DD 5
SECTION .text
global main
main:
    mov eax, 0 | int q = 0;
    mov ecx, 1 | int i = 1;
schleife:
    cmp ecx, dword [N] | i <= N
    jg ende | i <= N
    mov eax, ecx | q = i * i;
    imul eax, eax | q = i * i;
    inc ecx | i++
    jmp schleife | for (…)
ende:
    mov rax, 0 | return 0;
    ret | return 0;`,
    c: `DEFAULT REL
SECTION .data
N DD 5
SECTION .text
global main
main:
    mov eax, 0 | int summe = 0;
    mov ecx, 1 | int i = 1;
schleife:
    cmp ecx, dword [N] | i <= N
    jg ende | i <= N
    mov edx, ecx | q = i * i;
    imul edx, edx | q = i * i;
    add eax, edx | summe += q;
    inc ecx | i++
    jmp schleife | for (…)
ende:
    mov rax, 0 | return 0;
    ret | return 0;`,
    d: `DEFAULT REL
SECTION .data
N DQ 5
SECTION .text
global main
main:
    mov rax, 0 | long summe = 0;
    mov rcx, 1 | long i = 1;
; Quadratzahlen werden gebildet und auf den Stack gelegt
L1:
    cmp rcx, qword [N] | i <= N
    jg E1 | i <= N
    mov rax, rcx | push(i * i);
    imul rax, rax | push(i * i);
    push rax | push(i * i);
    inc rcx | i++
    jmp L1 | for (…)
E1:
    mov rax, 0 | summe = 0;
    mov rcx, 1 | i = 1;
; Quadratzahlen werden aufsummiert
L2:
    cmp rcx, qword [N] | i <= N
    jg E2 | i <= N
    pop rdx | summe += pop();
    add rax, rdx | summe += pop();
    inc rcx | i++
    jmp L2 | for (…)
E2:
    mov rax, 0 | return 0;
    ret | return 0;`,
    e: `DEFAULT REL
SECTION .data
Ergebnis DQ 0
N DQ 5
SECTION .text
global main
main:
    push rbp | Prolog
    mov rbp, rsp        ; rbp und rsp haben nun den gleichen Wert | Prolog
    mov rax, 0          ; rax fuer die Zwischenergebnisse | Ergebnis = 0
    push qword [N]      ; Startargument auf den Stack | Aufgabe N auf den Stack
anfang:
    cmp rsp, rbp | Stack leer?
    je ende             ; Stack leer -> fertig | Stack leer?

  /* ---------- Mini-Simulator ---------- */

        const D1 = dstate(p, m, scroll, ev.L.c, ev.L.ci);
        if (mode === 'jump') {
          const roundEnd = m.done || p.loopHeads.includes(m.pc);
          if (roundEnd) ops.push(SET(Object.assign(clone(D1), { hot: ev.hot, on: [lid(p, ev.line)] }), 420));
        } else ops.push(...opsFor(p, ev, D1, mode));
        cur = D1;
        if (typeof b.run === 'number' && n >= b.run) break;
        if (b.run === 'round' && p.loopHeads.includes(m.pc)) break;
        if (b.run === 'rest' && m.pc === nextIns(p, p.labels.ende)) break;
      }
      if (mode === 'jump') ops.push(SET(Object.assign(clone(cur), { hot: evs[evs.length - 1].hot, on: [lid(p, evs[evs.length - 1].line)] }), 420));
      // Endzustand = letzter SET mit allen Feldern
      let fin = D0; ops.forEach(o => { if (o.set) fin = apply(fin, o.set); });
      let say = b.say;
      if (say == null) say = b.run === 'round' || b.run === 'rest' ? ROUND[p.id](evs, m0, m) : autoText(p, evs[0]);
      if (b.pre) say = b.pre + say;
      if (b.add) say += b.add;
      steps.push({ say, st: clone(D) });
      steps.push({ say, st: fin, play: true, ops, from: D0 });
      D = fin;
    });
    sc.steps = steps;
  });

  /* ---------- Abspielen ---------- */
  let timers = [], busy = false, target = null;
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  const stop = () => { timers.forEach(clearTimeout); timers = []; fx.innerHTML = ''; };
  function finish() { stop(); busy = false; draw(target, true); ui(); }
  function play(stp) {
    busy = true; target = stp.st; ui();
    let cur = stp.from, t = 0;
    draw(cur, false);
    stp.ops.forEach(o => {
      if (o.fly) { const [a, b, txt, cls] = o.fly, d = o.ms || 700; later(t, () => fly(a, b, txt, d, cls)); t += d + 40; }
      else if (o.rfly) { const [id, txt] = o.rfly; later(t, () => ripFly(id, txt)); t += 1700; }
      else if (o.set) { const p = o.set; later(t, () => { cur = apply(cur, p); draw(cur, false); }); t += o.ms || 420; }
    });
    later(t + 100, () => { busy = false; draw(target, false); ui(); });
  }

  let cur = 0, k = 0, steps = [];
  const dots = $('dots');
  S.forEach((s, i) => { const d = document.createElement('button'); d.className = 'dot'; d.textContent = s.dot; d.title = s.title; d.onclick = () => show(i); dots.appendChild(d); });
  function ui() {
    const nx = steps[k + 1];
    $('next').textContent = busy ? 'läuft …' : nx && nx.play ? 'Zeigen →' : (!nx && cur < S.length - 1 ? 'Nächster Teil →' : 'Weiter →');
    $('next').classList.toggle('play', !busy && !!(nx && nx.play));
    $('next').disabled = !busy && !nx && cur === S.length - 1;
    $('prev').disabled = cur === 0 && k === 0;
    $('cnt').textContent = 'Schritt ' + (k + 1) + ' / ' + steps.length;
  }
  function go(j, anim) {
    const s = steps[j]; k = j;
    $('say').innerHTML = s.say;
    stop(); busy = false; target = s.st;
    if (anim && s.play) play(s); else draw(s.st, true);
    ui();
  }
  function show(i, last) {
    stop(); busy = false; cur = i; steps = S[i].steps;
    if (S[i].extra) {   // große Einblendung „Zusatzaufgabe“, ca. 1,25 s, Klick schließt sie sofort
      const old = document.querySelector('.xintro'); if (old) old.remove();
      const x = document.createElement('div'); x.className = 'xintro';
      x.innerHTML = '<div class="card"><b>Zusatzaufgabe</b><span>Nicht Teil der Übung · zu Hause, für alle, die mehr wollen</span></div>';
      x.onclick = () => x.remove(); x.addEventListener('animationend', e => { if (e.target === x) x.remove(); });
      document.body.appendChild(x);
      setTimeout(() => x.remove(), 1400);   // falls animationend ausbleibt
    }
    $('act').innerHTML = S[i].extra ? '<span class="xwarn">Zusatzaufgabe · zu Hause</span>' : esc(S[i].act); $('ttl').textContent = S[i].title;
    [...dots.children].forEach((d, n) => { if (n === cur) d.setAttribute('aria-current', 'step'); else d.removeAttribute('aria-current'); });
    go(last ? steps.length - 1 : 0, false);
  }
  function next() {
    if (busy) return finish();
    if (k < steps.length - 1) go(k + 1, true); else if (cur < S.length - 1) show(cur + 1);
  }
  function prev() {
    if (busy) finish();
    if (k > 0) go(k - 1, false); else if (cur > 0) show(cur - 1, true);
  }
  $('next').onclick = next; $('prev').onclick = prev; $('replay').onclick = () => show(cur);
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'r' || e.key === 'R') show(cur);
  });

  function fit() {
    const w = box.clientWidth, s = Math.max(0.5, Math.min(w / 1000, (window.innerHeight - 250) / 380, 1.6));
    stage.style.transform = 'scale(' + s + ')'; stage.style.left = (w - 1000 * s) / 2 + 'px'; box.style.height = 380 * s + 'px';
  }
  window.addEventListener('resize', fit);
  window.__go = (i, j) => { show(i); if (j) go(Math.min(j, steps.length - 1), false); };
  window.__S = S;
  fit(); show(0);
})();
</script>
</body>
</html>
